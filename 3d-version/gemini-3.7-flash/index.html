<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Bird 3D - Cyber Skies Showcase</title>
  <meta name="description" content="A state-of-the-art 3D Flappy Bird clone built with Three.js, featuring procedural worlds, dynamic lighting, customizable bird skins, Web Audio synthesis, and multi-perspective cameras." />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="game-container">
    <!-- Three.js Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Post-processing vignette and speed lines overlay -->
    <div id="vignette"></div>
    <div id="speed-flash"></div>

    <!-- HUD Overlay -->
    <div id="hud">
      <div class="hud-top">
        <div class="hud-left">
          <div class="glass-pill">
            <span class="coin-icon">🟡</span>
            <span id="coin-counter">0</span>
          </div>
          <div id="active-powerups"></div>
        </div>

        <div class="score-container">
          <div id="score-display">0</div>
          <div id="combo-badge">COMBO x1</div>
        </div>

        <div class="hud-right">
          <button id="btn-theme" class="hud-btn" title="Change Theme (T)">🎨</button>
          <button id="btn-mute" class="hud-btn" title="Mute Audio (M)">🔊</button>
          <button id="btn-settings" class="hud-btn" title="Settings (O)">⚙️</button>
        </div>
      </div>

      <div id="near-miss-banner">⚡ NEAR MISS! +2</div>

      <div class="hud-bottom">
        <div class="camera-selector">
          <button class="cam-btn active" data-mode="THIRD_PERSON" id="btn-cam-3rd">Action Cam [1]</button>
          <button class="cam-btn" data-mode="SIDE_VIEW" id="btn-cam-side">Side 2.5D [2]</button>
          <button class="cam-btn" data-mode="FIRST_PERSON" id="btn-cam-1st">Cockpit [3]</button>
        </div>

        <div class="hud-bottom-right">
          <button id="btn-wardrobe-hud" class="glass-pill" style="cursor: pointer;">
            <span>👕</span> Wardrobe
          </button>
        </div>
      </div>
    </div>

    <!-- READY HINT OVERLAY -->
    <div id="ready-overlay">
      <div class="tap-indicator">
        <span>🚀</span> PRESS SPACE OR TAP TO FLY
      </div>
    </div>

    <!-- TITLE / MAIN MENU OVERLAY -->
    <div id="menu-overlay" class="screen-overlay active">
      <div class="card-modal">
        <h1 class="game-title">FLAPPY 3D</h1>
        <p class="game-subtitle">CYBER SKIES ODYSSEY</p>

        <div class="controls-card">
          <div class="ctrl-item"><span class="kbd-key">SPACE / W / ↑</span> <span>Flap & Fly</span></div>
          <div class="ctrl-item"><span class="kbd-key">C / 1, 2, 3</span> <span>Switch Camera</span></div>
          <div class="ctrl-item"><span class="kbd-key">T</span> <span>Cycle Biome</span></div>
          <div class="ctrl-item"><span class="kbd-key">M</span> <span>Toggle Audio</span></div>
        </div>

        <button id="btn-start" class="btn-primary">
          <span>🚀</span> START FLIGHT
        </button>
        <button id="btn-wardrobe" class="btn-secondary">
          <span>👕</span> BIRD WARDROBE & SHOP
        </button>
      </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div id="gameover-overlay" class="screen-overlay">
      <div class="card-modal">
        <h2 class="game-title" id="gameover-title">GAME OVER</h2>
        <p class="game-subtitle" id="gameover-subtitle">FLIGHT COMPLETE</p>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">Final Score</div>
            <div class="stat-value" id="stat-score">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Best Record</div>
            <div class="stat-value stat-record" id="stat-high">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Max Combo</div>
            <div class="stat-value" id="stat-combo">x1</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Coins Earned</div>
            <div class="stat-value" id="stat-coins">+0</div>
          </div>
        </div>

        <button id="btn-restart" class="btn-primary">
          <span>🔄</span> PLAY AGAIN (SPACE)
        </button>
        <button id="btn-gameover-wardrobe" class="btn-secondary">
          <span>👕</span> CUSTOMIZE BIRD
        </button>
      </div>
    </div>

    <!-- WARDROBE / SHOP MODAL -->
    <div id="wardrobe-overlay" class="screen-overlay">
      <div class="card-modal shop-modal">
        <h2 class="game-title" style="font-size: 2rem;">BIRD WARDROBE</h2>
        <div class="tab-nav">
          <button class="tab-btn active" data-tab="skins">Bird Skins</button>
          <button class="tab-btn" data-tab="hats">Hats & Gear</button>
          <button class="tab-btn" data-tab="trails">Speed Trails</button>
        </div>

        <div id="shop-items-container" class="items-grid"></div>

        <button id="btn-close-wardrobe" class="btn-primary">
          DONE & RETURN
        </button>
      </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-overlay" class="screen-overlay">
      <div class="card-modal">
        <h2 class="game-title" style="font-size: 2rem;">SETTINGS</h2>
        <div style="display: flex; flex-direction: column; gap: 16px; margin: 20px 0; text-align: left;">
          <div>
            <label style="font-weight: 700; font-size: 0.9rem;">Sound Effects Volume</label>
            <input type="range" id="slider-sfx" min="0" max="1" step="0.05" value="0.8" style="width: 100%; margin-top: 6px;" />
          </div>
          <div>
            <label style="font-weight: 700; font-size: 0.9rem;">Music Volume</label>
            <input type="range" id="slider-music" min="0" max="1" step="0.05" value="0.35" style="width: 100%; margin-top: 6px;" />
          </div>
          <div>
            <label style="font-weight: 700; font-size: 0.9rem;">Biome Theme</label>
            <select id="select-theme" style="width: 100%; padding: 8px 12px; margin-top: 6px; background: #1e293b; color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; font-weight: 700;">
              <option value="SUNSET">Sunset Highlands</option>
              <option value="CYBERPUNK">Neo Cyber 2099</option>
              <option value="NEBULA">Cosmic Nebula</option>
              <option value="VOLCANIC">Infernal Canyon</option>
            </select>
          </div>
        </div>
        <button id="btn-close-settings" class="btn-primary">
          SAVE & CLOSE
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
