<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRISM — a 3D Flappy Bird, refracted</title>
  <meta name="description" content="A 3D Flappy Bird cut from light. Fly a crystal bird through faceted gem gates, built with Three.js physical materials and bloom.">
  <meta name="theme-color" content="#0a0a16">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a16'/%3E%3Cpath d='M16 4 L26 12 L22 28 L10 28 L6 12 Z' fill='%2363e8ff'/%3E%3Cpath d='M16 4 L26 12 L16 16 Z' fill='%23ff7ae0'/%3E%3Cpath d='M16 4 L6 12 L16 16 Z' fill='%23a78bff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- ===================== HUD ===================== -->
  <div id="hud" class="hidden">
    <div id="score">0</div>
    <div id="best-line">BEST <span id="best">0</span></div>
  </div>

  <div id="corner-buttons">
    <button type="button" id="btn-pause" class="chip" title="Pause (P)" aria-label="Pause">❚❚</button>
    <button type="button" id="btn-mute" class="chip" title="Sound (M)" aria-label="Mute">♪</button>
  </div>

  <!-- ===================== START ===================== -->
  <div id="screen-start" class="screen">
    <div class="gem-card">
      <div class="facet-mark">◆</div>
      <h1 class="title">PRISM</h1>
      <p class="subtitle">a flappy bird, refracted through a thousand facets of light</p>
      <div class="rule"></div>
      <p class="howto">
        <span class="key">SPACE</span> <span class="key">CLICK</span> <span class="key">TAP</span>
        <br>flap to climb · thread the crystal gates
      </p>
      <button type="button" id="btn-start" class="big-btn">ENTER THE PRISM</button>
      <div id="start-board" class="mini-board"></div>
      <p class="credits">cut by Claude · Sonnet 5 · three.js</p>
    </div>
  </div>

  <!-- ===================== GAME OVER ===================== -->
  <div id="screen-over" class="screen hidden">
    <div class="gem-card">
      <div class="facet-mark facet-mark-red">◇</div>
      <h2 class="over-title">SHATTERED.</h2>
      <div class="score-row">
        <div class="score-box"><span class="label">SCORE</span><span id="final-score">0</span></div>
        <div class="score-box"><span class="label">BEST</span><span id="final-best">0</span></div>
      </div>
      <div id="new-best-tag" class="new-best hidden">NEW BEST CUT!</div>

      <form id="name-form" class="name-form hidden">
        <label for="initials">top ten — engrave your initials</label>
        <div class="name-row">
          <input type="text" id="initials" maxlength="3" autocomplete="off" spellcheck="false" placeholder="AAA">
          <button type="submit" class="small-btn">ENGRAVE</button>
        </div>
      </form>

      <div id="leaderboard" class="board"></div>
      <button type="button" id="btn-retry" class="big-btn">RECUT &amp; RETRY</button>
      <p class="hint">press SPACE to retry</p>
    </div>
  </div>

  <!-- ===================== PAUSE ===================== -->
  <div id="screen-pause" class="screen hidden">
    <div class="gem-card slim">
      <div class="facet-mark">◆</div>
      <h2 class="over-title">SUSPENDED<br>IN LIGHT</h2>
      <button type="button" id="btn-resume" class="big-btn">RESUME</button>
      <p class="hint">press P to resume</p>
    </div>
  </div>

  <div id="grain"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
