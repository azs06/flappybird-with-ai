<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2f8fe6" />
    <title>Flappy Bird 3D</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='15' cy='16' r='12' fill='%23ffd32a' stroke='%232b3a4a' stroke-width='2'/%3E%3Ccircle cx='20' cy='12' r='3.4' fill='white' stroke='%232b3a4a'/%3E%3Ccircle cx='21' cy='12' r='1.4' fill='%232b3a4a'/%3E%3Cpath d='M26 16l6 2-6 3z' fill='%23ff7b2f'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="hud">
      <div id="score" class="hidden">0</div>

      <div id="ready">
        <h1 class="title">FLAPPY<span>BIRD&nbsp;3D</span></h1>
        <p class="tap-hint">CLICK&nbsp;&middot;&nbsp;TAP&nbsp;&middot;&nbsp;SPACE</p>
        <p class="sub-hint">to flap your wings</p>
      </div>

      <div id="over" class="hidden">
        <div class="panel">
          <h2 class="over-title">GAME OVER</h2>
          <div class="panel-body">
            <div id="medal" data-tier="none">
              <div class="medal-disc"><div class="medal-star"></div></div>
              <div id="medal-label">&mdash;</div>
            </div>
            <div class="panel-rows">
              <div class="row"><span class="lbl">SCORE</span><span id="over-score" class="val">0</span></div>
              <div class="row"><span class="lbl">BEST</span><span id="over-best" class="val">0</span></div>
            </div>
          </div>
          <div id="new-best" class="hidden">NEW BEST!</div>
          <button id="restart">PLAY AGAIN</button>
          <p class="sub-hint">or tap anywhere &middot; R to restart</p>
        </div>
      </div>

      <button id="mute" aria-pressed="false" aria-label="toggle sound">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path class="spk" d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <path class="w1" d="M16 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path class="w2" d="M18.5 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          <line class="slash" x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>

      <div id="stats" class="hidden"></div>
    </div>

    <div id="flash"></div>

    <div id="loading">
      <div class="loader-bird"></div>
    </div>

    <div id="fatal" class="hidden">
      <p>WebGL is not available in this browser.</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
