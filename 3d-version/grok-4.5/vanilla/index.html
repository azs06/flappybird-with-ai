<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SPARK — 3D Flappy Bird</title>
  <meta name="description" content="A molten firebird streaks through dark monoliths under a star-drunk sky. A 3D Flappy Bird showcase built with Three.js.">
  <meta name="theme-color" content="#050508">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050508'/%3E%3Cpath d='M8 18 L16 6 L18 14 L26 10 L20 26 Z' fill='%23ffb020'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23fff5e0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="SPARK 3D game canvas"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden" aria-live="polite">
    <div id="score">0</div>
    <div id="best-line">BEST <span id="best">0</span></div>
  </div>

  <div id="corner-buttons">
    <button type="button" id="btn-pause" class="chip" title="Pause (P)" aria-label="Pause">❚❚</button>
    <button type="button" id="btn-mute" class="chip" title="Sound (M)" aria-label="Mute">♪</button>
  </div>

  <!-- START -->
  <div id="screen-start" class="screen">
    <div class="card">
      <div class="ember" aria-hidden="true">✦</div>
      <h1 class="title">SPARK</h1>
      <p class="subtitle">a firebird through the dark</p>
      <div class="rule"></div>
      <p class="howto">
        <span class="key">SPACE</span>
        <span class="key">CLICK</span>
        <span class="key">TAP</span>
        <br>flap to climb · thread the monoliths
      </p>
      <button type="button" id="btn-start" class="big-btn">IGNITE</button>
      <div id="start-board" class="mini-board"></div>
      <p class="credits">forged by Grok 4.5 · three.js</p>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="screen-over" class="screen hidden">
    <div class="card">
      <div class="ember ember-dim" aria-hidden="true">◇</div>
      <h2 class="over-title">EXTINGUISHED</h2>
      <div class="score-row">
        <div class="score-box">
          <span class="label">SCORE</span>
          <span id="final-score">0</span>
        </div>
        <div class="score-box">
          <span class="label">BEST</span>
          <span id="final-best">0</span>
        </div>
      </div>
      <div id="new-best-tag" class="new-best hidden">NEW SPARK RECORD</div>

      <form id="name-form" class="name-form hidden">
        <label for="initials">top ten — carve your mark</label>
        <div class="name-row">
          <input type="text" id="initials" maxlength="3" autocomplete="off" spellcheck="false" placeholder="AAA" aria-label="Initials">
          <button type="submit" class="small-btn">SAVE</button>
        </div>
      </form>

      <div id="leaderboard" class="board"></div>
      <button type="button" id="btn-retry" class="big-btn">REKINDLE</button>
      <p class="hint">press SPACE to retry</p>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="screen-pause" class="screen hidden">
    <div class="card slim">
      <div class="ember" aria-hidden="true">✦</div>
      <h2 class="over-title">SUSPENDED</h2>
      <button type="button" id="btn-resume" class="big-btn">RESUME</button>
      <p class="hint">press P to resume</p>
    </div>
  </div>

  <div id="vignette" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
